[package]
name = "stint"
version = "0.1.0"
description = "A lightweight, private, local-first productivity tracker"
authors = ["Stint contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "stint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite from source so every platform gets the same, current version.
rusqlite = { version = "0.43", features = ["bundled"] }
active-win-pos-rs = "0.11"
user-idle = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
